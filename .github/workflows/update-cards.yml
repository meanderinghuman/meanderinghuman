name: Update README cards

on:
  schedule:
    - cron: "0 6 * * *" # daily
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/update-cards.yml

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_rank=true&hide=issues,contribs&hide_border=true&title_color=1a5fb4&icon_color=1a5fb4&disable_animations=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate stats-dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_rank=true&hide=issues,contribs&hide_border=true&theme=github_dark&bg_color=0d1117&disable_animations=true
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top-langs
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&title_color=1a5fb4&icon_color=1a5fb4&disable_animations=true
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top-langs-dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&theme=github_dark&bg_color=0d1117&disable_animations=true
          path: profile/top-langs-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate pin-storeops-copilot
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=storeops-copilot&description_lines_count=2&hide_border=true&title_color=1a5fb4&icon_color=1a5fb4&disable_animations=true
          path: profile/pin-storeops-copilot.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate pin-storeops-copilot-dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=storeops-copilot&description_lines_count=2&hide_border=true&theme=github_dark&bg_color=0d1117&disable_animations=true
          path: profile/pin-storeops-copilot-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate pin-ddp-scaling-anatomy
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=ddp-scaling-anatomy&description_lines_count=2&hide_border=true&title_color=1a5fb4&icon_color=1a5fb4&disable_animations=true
          path: profile/pin-ddp-scaling-anatomy.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate pin-ddp-scaling-anatomy-dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=ddp-scaling-anatomy&description_lines_count=2&hide_border=true&theme=github_dark&bg_color=0d1117&disable_animations=true
          path: profile/pin-ddp-scaling-anatomy-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate pin-ClinSynapse
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=ClinSynapse&description_lines_count=2&hide_border=true&title_color=1a5fb4&icon_color=1a5fb4&disable_animations=true
          path: profile/pin-ClinSynapse.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate pin-ClinSynapse-dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=ClinSynapse&description_lines_count=2&hide_border=true&theme=github_dark&bg_color=0d1117&disable_animations=true
          path: profile/pin-ClinSynapse-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate pin-ShapeRAGen
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=ShapeRAGen&description_lines_count=2&hide_border=true&title_color=1a5fb4&icon_color=1a5fb4&disable_animations=true
          path: profile/pin-ShapeRAGen.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate pin-ShapeRAGen-dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=ShapeRAGen&description_lines_count=2&hide_border=true&theme=github_dark&bg_color=0d1117&disable_animations=true
          path: profile/pin-ShapeRAGen-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate pin-DiffuKnee
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=DiffuKnee&description_lines_count=2&hide_border=true&title_color=1a5fb4&icon_color=1a5fb4&disable_animations=true
          path: profile/pin-DiffuKnee.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate pin-DiffuKnee-dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=DiffuKnee&description_lines_count=2&hide_border=true&theme=github_dark&bg_color=0d1117&disable_animations=true
          path: profile/pin-DiffuKnee-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
